services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.production

    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy
        restart: true

    ports:
      - "127.0.0.1:8000:8000"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request;
          urllib.request.urlopen(
              "http://127.0.0.1:8000/health/db",
              timeout=10
          )
      interval: 20s
      timeout: 15s
      retries: 5
      start_period: 60s

  db:
    image: postgres:16

    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data: