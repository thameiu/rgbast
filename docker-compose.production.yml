version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.production

    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy
        restart: true

    expose:
      - "8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/db', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    stop_grace_period: 30s


  db:
    image: postgres:16

    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    stop_grace_period: 30s


  nginx:
    image: nginx:latest

    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /home/deploy/rgbast-web/dist:/usr/share/nginx/html:ro

    depends_on:
      web:
        condition: service_healthy
        restart: true

    stop_grace_period: 15s


volumes:
  postgres_data:
